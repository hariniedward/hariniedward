<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="600" viewBox="0 0 1600 600" role="img" aria-labelledby="title desc">
  <title id="title">Harini Edward - SOC Analyst</title>
  <desc id="desc">Professional blue security operations center banner for Harini Edward, SOC Analyst, Security Analyst and Digital Forensics graduate.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#030712"/>
      <stop offset="0.48" stop-color="#071827"/>
      <stop offset="1" stop-color="#02070d"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="0.5" stop-color="#0ea5e9"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".20"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#38bdf8" stroke-opacity=".055"/>
    </pattern>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="textGlow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1600" height="600" fill="url(#bg)"/>
  <rect width="1600" height="600" fill="url(#grid)"/>
  <ellipse cx="290" cy="295" rx="420" ry="360" fill="url(#glow)"/>
  <ellipse cx="1350" cy="120" rx="330" ry="230" fill="url(#glow)" opacity=".42"/>

  <!-- top system rail -->
  <path d="M64 56H575L605 78H1536" fill="none" stroke="#22d3ee" stroke-opacity=".32" stroke-width="2"/>
  <circle cx="64" cy="56" r="5" fill="#22d3ee" filter="url(#softGlow)"/>
  <text x="82" y="48" fill="#7dd3fc" font-family="Consolas,monospace" font-size="17" letter-spacing="4">SECURITY OPERATIONS CENTER</text>
  <g font-family="Consolas,monospace" font-size="14" letter-spacing="2">
    <circle cx="1336" cy="49" r="5" fill="#34d399"/>
    <text x="1351" y="54" fill="#6ee7b7">SYSTEM ONLINE</text>
  </g>

  <!-- shield emblem -->
  <g transform="translate(92 135)">
    <path d="M155 0 282 48v112c0 103-58 177-127 220C86 337 28 263 28 160V48Z" fill="#071827" stroke="url(#shield)" stroke-width="4" filter="url(#softGlow)"/>
    <path d="M155 26 253 63v92c0 80-42 141-98 181-56-40-98-101-98-181V63Z" fill="none" stroke="#38bdf8" stroke-opacity=".45" stroke-width="2"/>
    <circle cx="155" cy="163" r="76" fill="none" stroke="#22d3ee" stroke-opacity=".26" stroke-width="2" stroke-dasharray="7 9"/>
    <path d="M112 117h86v83h-86z" fill="#03101a" stroke="#67e8f9" stroke-width="3"/>
    <path d="M132 117V94c0-31 46-31 46 0v23" fill="none" stroke="#67e8f9" stroke-width="8" stroke-linecap="round"/>
    <circle cx="155" cy="157" r="12" fill="#22d3ee"/>
    <path d="M155 169v18" stroke="#22d3ee" stroke-width="7" stroke-linecap="round"/>
    <text x="155" y="287" text-anchor="middle" fill="#e0f2fe" font-family="Arial,sans-serif" font-size="44" font-weight="800" letter-spacing="5">HE</text>
    <text x="155" y="316" text-anchor="middle" fill="#38bdf8" font-family="Consolas,monospace" font-size="13" letter-spacing="4">DEFEND • DETECT</text>
  </g>

  <!-- identity -->
  <g transform="translate(445 145)">
    <text x="0" y="0" fill="#38bdf8" font-family="Consolas,monospace" font-size="18" letter-spacing="5">// BLUE TEAM OPERATOR</text>
    <text x="0" y="83" fill="#f8fafc" font-family="Arial,sans-serif" font-size="78" font-weight="800" letter-spacing="5">HARINI EDWARD</text>
    <rect x="0" y="110" width="860" height="3" fill="url(#cyan)"/>
    <text x="0" y="158" fill="#7dd3fc" font-family="Consolas,monospace" font-size="22" letter-spacing="3">SOC ANALYST  |  SECURITY ANALYST  |  DIGITAL FORENSICS</text>
    <text x="0" y="208" fill="#94a3b8" font-family="Arial,sans-serif" font-size="21" letter-spacing="1">MONITOR THREATS  •  INVESTIGATE ALERTS  •  PRESERVE EVIDENCE  •  RESPOND</text>
  </g>

  <!-- capability panels -->
  <g transform="translate(445 405)" font-family="Consolas,monospace">
    <g>
      <rect width="255" height="95" rx="6" fill="#071522" stroke="#22d3ee" stroke-opacity=".34"/>
      <path d="M0 7V0h7M248 0h7v7M255 88v7h-7M7 95H0v-7" fill="none" stroke="#38bdf8" stroke-width="2"/>
      <text x="24" y="33" fill="#64748b" font-size="13" letter-spacing="2">SIEM &amp; DETECTION</text>
      <text x="24" y="63" fill="#e0f2fe" font-size="17">WAZUH • SPLUNK • QRADAR</text>
      <circle cx="226" cy="31" r="5" fill="#34d399"/>
    </g>
    <g transform="translate(276)">
      <rect width="255" height="95" rx="6" fill="#071522" stroke="#22d3ee" stroke-opacity=".34"/>
      <path d="M0 7V0h7M248 0h7v7M255 88v7h-7M7 95H0v-7" fill="none" stroke="#38bdf8" stroke-width="2"/>
      <text x="24" y="33" fill="#64748b" font-size="13" letter-spacing="2">THREAT ANALYSIS</text>
      <text x="24" y="63" fill="#e0f2fe" font-size="17">MITRE ATT&amp;CK • TRIAGE</text>
      <circle cx="226" cy="31" r="5" fill="#34d399"/>
    </g>
    <g transform="translate(552)">
      <rect width="255" height="95" rx="6" fill="#071522" stroke="#22d3ee" stroke-opacity=".34"/>
      <path d="M0 7V0h7M248 0h7v7M255 88v7h-7M7 95H0v-7" fill="none" stroke="#38bdf8" stroke-width="2"/>
      <text x="24" y="33" fill="#64748b" font-size="13" letter-spacing="2">DFIR &amp; EVIDENCE</text>
      <text x="24" y="63" fill="#e0f2fe" font-size="17">INTEGRITY • CHAIN OF CUSTODY</text>
      <circle cx="226" cy="31" r="5" fill="#34d399"/>
    </g>
  </g>

  <!-- telemetry right edge -->
  <g transform="translate(1370 170)" opacity=".42">
    <path d="M0 82h32l13-39 22 101 26-78 18 16h124" fill="none" stroke="#22d3ee" stroke-width="3" filter="url(#textGlow)"/>
    <path d="M0 185h38l16-32 20 64 27-97 18 65h116" fill="none" stroke="#38bdf8" stroke-opacity=".65" stroke-width="2"/>
    <g fill="#38bdf8"><circle cx="45" cy="43" r="4"/><circle cx="67" cy="144" r="4"/><circle cx="101" cy="120" r="4"/></g>
  </g>

  <!-- bottom rail -->
  <path d="M64 548H1000l26-20h510" fill="none" stroke="#22d3ee" stroke-opacity=".28" stroke-width="2"/>
  <text x="64" y="578" fill="#475569" font-family="Consolas,monospace" font-size="13" letter-spacing="3">EVIDENCE-DRIVEN  //  DETECTION-FOCUSED  //  READY TO RESPOND</text>
</svg>
